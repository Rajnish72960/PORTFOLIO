<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Tic-Tac-Toe | Two Player Demo</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <header class="demo-topbar">
    <a class="demo-brand" href="../index.html#projects">RK<span>.</span> Projects</a>
    <a class="back-link" href="../index.html#projects">← Back to portfolio</a>
  </header>
  <main class="demo-main game-wrap">
    <section class="game-card" aria-label="Tic-Tac-Toe game">
      <p class="demo-kicker">Two players · One board</p>
      <h1>Tic-Tac-Toe</h1>
      <p>Take turns, make a line, and keep the friendly rivalry going.</p>
      <div class="scoreboard" aria-label="Scores">
        <div class="score"><strong id="score-x">0</strong><span>Player X</span></div>
        <div class="score"><strong id="score-o">0</strong><span>Player O</span></div>
      </div>
      <p class="game-status" id="game-status" aria-live="polite">Player X goes first</p>
      <div class="game-board" id="game-board" role="group" aria-label="Tic-Tac-Toe board">
        <button class="game-cell" type="button" data-cell="0" aria-label="Empty cell 1"></button>
        <button class="game-cell" type="button" data-cell="1" aria-label="Empty cell 2"></button>
        <button class="game-cell" type="button" data-cell="2" aria-label="Empty cell 3"></button>
        <button class="game-cell" type="button" data-cell="3" aria-label="Empty cell 4"></button>
        <button class="game-cell" type="button" data-cell="4" aria-label="Empty cell 5"></button>
        <button class="game-cell" type="button" data-cell="5" aria-label="Empty cell 6"></button>
        <button class="game-cell" type="button" data-cell="6" aria-label="Empty cell 7"></button>
        <button class="game-cell" type="button" data-cell="7" aria-label="Empty cell 8"></button>
        <button class="game-cell" type="button" data-cell="8" aria-label="Empty cell 9"></button>
      </div>
      <div class="game-actions">
        <button class="demo-button" id="new-round" type="button">New round</button>
        <button class="demo-button secondary" id="reset-scores" type="button">Reset scores</button>
      </div>
    </section>
  </main>
  <script src="tic-tac-toe.js"></script>
</body>
</html>
