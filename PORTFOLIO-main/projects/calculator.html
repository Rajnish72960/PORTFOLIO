<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Calculator | Interactive Demo</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <header class="demo-topbar">
    <a class="demo-brand" href="../index.html#projects">RK<span>.</span> Projects</a>
    <a class="back-link" href="../index.html#projects">← Back to portfolio</a>
  </header>
  <main class="demo-main calculator-wrap">
    <section class="calculator" aria-label="Calculator">
      <div class="calc-heading"><h1>Calculator</h1><span>Keyboard ready</span></div>
      <div class="calc-display" aria-live="polite" aria-atomic="true">
        <div class="calc-expression" id="calc-expression"></div>
        <div class="calc-result" id="calc-result">0</div>
      </div>
      <div class="calc-keys" id="calc-keys">
        <button class="calc-key function" data-action="clear">AC</button>
        <button class="calc-key function" data-action="backspace" aria-label="Backspace">⌫</button>
        <button class="calc-key function" data-action="percent">%</button>
        <button class="calc-key operator" data-operator="÷">÷</button>
        <button class="calc-key" data-digit="7">7</button><button class="calc-key" data-digit="8">8</button><button class="calc-key" data-digit="9">9</button>
        <button class="calc-key operator" data-operator="×">×</button>
        <button class="calc-key" data-digit="4">4</button><button class="calc-key" data-digit="5">5</button><button class="calc-key" data-digit="6">6</button>
        <button class="calc-key operator" data-operator="−">−</button>
        <button class="calc-key" data-digit="1">1</button><button class="calc-key" data-digit="2">2</button><button class="calc-key" data-digit="3">3</button>
        <button class="calc-key operator" data-operator="+">+</button>
        <button class="calc-key zero" data-digit="0">0</button><button class="calc-key" data-action="decimal">.</button>
        <button class="calc-key equals" data-action="equals">=</button>
      </div>
      <p class="calc-note">Use the buttons or your keyboard. Esc clears the calculation.</p>
    </section>
  </main>
  <script src="calculator.js"></script>
</body>
</html>
