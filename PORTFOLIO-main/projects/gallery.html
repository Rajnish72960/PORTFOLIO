<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Gallery | Photo Collection Demo</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <header class="demo-topbar">
    <a class="demo-brand" href="../index.html#projects">RK<span>.</span> Projects</a>
    <a class="back-link" href="../index.html#projects">← Back to portfolio</a>
  </header>
  <main class="demo-main">
    <p class="demo-kicker">Selected moments</p>
    <h1 class="demo-title">Photo Gallery</h1>
    <p class="demo-subtitle">Browse by collection, then open a photo for a closer look.</p>
    <div class="gallery-toolbar" role="group" aria-label="Filter photos">
      <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">All photos</button>
      <button class="filter-button" type="button" data-filter="nature" aria-pressed="false">Nature</button>
      <button class="filter-button" type="button" data-filter="travel" aria-pressed="false">Travel</button>
      <button class="filter-button" type="button" data-filter="architecture" aria-pressed="false">Architecture</button>
    </div>
    <section class="gallery-grid" id="gallery-grid" aria-label="Photo collection">
      <button class="gallery-card" type="button" data-category="nature" data-title="Quiet morning" data-image="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1400&q=85"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=700&q=80" alt="Sunlight over a misty green landscape" loading="lazy"><span class="gallery-caption"><strong>Quiet morning</strong><small>Nature</small></span></button>
      <button class="gallery-card" type="button" data-category="travel" data-title="Mountain road" data-image="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1400&q=85"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80" alt="Mountain peaks under a blue sky" loading="lazy"><span class="gallery-caption"><strong>Mountain road</strong><small>Travel</small></span></button>
      <button class="gallery-card" type="button" data-category="architecture" data-title="Lines and light" data-image="https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=1400&q=85"><img src="https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=700&q=80" alt="Modern white architecture with clean lines" loading="lazy"><span class="gallery-caption"><strong>Lines and light</strong><small>Architecture</small></span></button>
      <button class="gallery-card" type="button" data-category="nature" data-title="Open water" data-image="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1400&q=85"><img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=700&q=80" alt="Waves rolling across blue ocean water" loading="lazy"><span class="gallery-caption"><strong>Open water</strong><small>Nature</small></span></button>
      <button class="gallery-card" type="button" data-category="travel" data-title="Coastal escape" data-image="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1400&q=85"><img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=700&q=80" alt="Coastline beside a calm blue sea" loading="lazy"><span class="gallery-caption"><strong>Coastal escape</strong><small>Travel</small></span></button>
      <button class="gallery-card" type="button" data-category="nature" data-title="Forest path" data-image="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1400&q=85"><img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=700&q=80" alt="Sunlit path through a forest" loading="lazy"><span class="gallery-caption"><strong>Forest path</strong><small>Nature</small></span></button>
      <button class="gallery-card" type="button" data-category="architecture" data-title="City geometry" data-image="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=1400&q=85"><img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=700&q=80" alt="Geometric modern building facade" loading="lazy"><span class="gallery-caption"><strong>City geometry</strong><small>Architecture</small></span></button>
      <button class="gallery-card" type="button" data-category="travel" data-title="Above the clouds" data-image="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=85"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80" alt="Lake and mountain landscape beneath clouds" loading="lazy"><span class="gallery-caption"><strong>Above the clouds</strong><small>Travel</small></span></button>
      <button class="gallery-card" type="button" data-category="nature" data-title="Wild meadow" data-image="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1400&q=85"><img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=700&q=80" alt="Green meadow in soft afternoon light" loading="lazy"><span class="gallery-caption"><strong>Wild meadow</strong><small>Nature</small></span></button>
    </section>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Photo preview">
    <button class="lightbox-close" type="button" id="lightbox-close" aria-label="Close photo preview">×</button>
    <img id="lightbox-image" src="" alt="">
    <p class="lightbox-title" id="lightbox-title"></p>
  </div>
  <script src="gallery.js"></script>
</body>
</html>
